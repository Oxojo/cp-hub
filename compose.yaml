services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cphub
      POSTGRES_USER: cphub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cphub]
      interval: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://cphub:${POSTGRES_PASSWORD}@db:5432/cphub
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
    ports:
      - 127.0.0.1:4173:4173
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
